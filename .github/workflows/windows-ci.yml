name: Windows CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2022
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Record runner environment
        shell: pwsh
        run: |
          Get-CimInstance Win32_OperatingSystem | Select-Object Caption, Version, BuildNumber
          Write-Host "PowerShell $($PSVersionTable.PSVersion)"

      - name: Verify PowerShell for command and package tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $pwsh = Get-Command pwsh -ErrorAction SilentlyContinue
          if (-not $pwsh) { throw 'pwsh.exe not found on PATH; command runner tests will fail.' }
          $version = [version](& pwsh -NoProfile -Command '$PSVersionTable.PSVersion.ToString()')
          Write-Host "pwsh command: $($pwsh.Source)"
          Write-Host "pwsh version: $version"
          if ($version -lt [version]'7.2') { throw "PowerShell 7.2 or later required, found $version" }

      - name: Install pinned SDK
        shell: pwsh
        run: .\scripts\Install-Sdk.ps1

      - name: Check development environment
        shell: pwsh
        run: .\scripts\Test-Environment.ps1

      - name: Test publish pipeline with isolated commands
        shell: pwsh
        run: .\tests\PublishPipeline.Tests.ps1

      - name: Build, test and package
        shell: pwsh
        run: .\scripts\Publish.ps1

      - name: Inspect package and test inspection failures
        shell: pwsh
        run: |
          $archives = @(Get-ChildItem -LiteralPath artifacts -Filter 'TalosDesk-v*-win-x64.zip' -File)
          if ($archives.Count -ne 1) { throw 'Expected exactly one package from this CI checkout.' }
          .\scripts\Test-Package.ps1 -ArchivePath $archives[0].FullName -EvidenceDirectory artifacts/package-evidence | Format-List
          .\tests\PackageInspection.Tests.ps1 -ArchivePath $archives[0].FullName | Tee-Object -FilePath artifacts/package-inspection-tests.log

      - name: Save test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-test-results
          path: artifacts/tests/**/*.trx
          if-no-files-found: ignore

      - name: Save package inspection evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-inspection-evidence
          path: |
            artifacts/package-evidence/*.json
            artifacts/package-inspection-tests.log
          if-no-files-found: ignore
